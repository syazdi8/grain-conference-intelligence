<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conference Intelligence · Grain sales (prototype)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#/conferences">Conference Intelligence <span class="proto">prototype</span></a>
      <div class="ctx">
        <label class="who">Using as <select id="user" aria-label="Who's using this"></select></label>
        <span id="date-chip" class="chip" title="The prototype runs on a fixed demo date so the demo is reproducible"></span>
      </div>
    </div>
    <nav id="nav" aria-label="Main">
      <a href="#/conferences" data-route="conferences">Conferences</a>
      <a href="#/plan" data-route="plan">Plan</a>
      <a href="#/capture" data-route="capture">Capture</a>
      <a href="#/contacts" data-route="contacts">Contacts</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="view"><p class="muted pad">Loading…</p></main>
  <footer class="foot">
    <span>Sample team, people and companies are fictional. Conference data is public and sourced (see each event). Your changes stay in this browser only.</span>
    <button id="reset" type="button" class="link-btn">Reset demo data</button>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
